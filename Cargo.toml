[workspace]
members = ["cqrs", "cqrs-*", "examples/*"]
default-members = ["cqrs", "cqrs-*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
authors = ["Chris Martinez <chris.s.martinez@outlook.com>"]
license = "MIT"
repository = "https://github.com/commonsensesoftware/more-rs-cqrs"
rust-version = "1.94.0"
edition = "2024"

[workspace.dependencies]
async-stream = "0.3.6"
async-trait = "0.1.92"
azure_data_cosmos = "0.37.1"
futures = "0.3.34"
futures-core = "0.3.34"
more-di = "3.2.1"
more-options = "4.0.0"
rstest = "0.26.1"
serde = "1.0.229"
serde_json = "1.0.151"
syn = "3.0.3"
thiserror = "2.0.20"
testcontainers-modules = "0.15.0"
tokio = "1.53.1"
uuid = "1.24.0"
